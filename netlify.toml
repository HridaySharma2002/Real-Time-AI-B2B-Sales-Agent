# Netlify Configuration for ApexSales AI Frontend
# Sets base directory to frontend so Netlify does NOT attempt to install Python/pip backend dependencies.

[build]
  base = "frontend"
  publish = "."
  command = "echo 'Deploying static frontend...'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Access-Control-Allow-Origin = "*"
